name: Verificacao do website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar vulnerabilidades conhecidas
        run: npm audit --audit-level=high
      - name: Executar testes
        run: npm run check
      - name: Verificar sintaxe da administracao local
        run: |
          node --check scripts/admin-security.mjs
          node --check scripts/admin-content.mjs
          node --check scripts/admin-ui.mjs
          node --check scripts/admin-preview.mjs
          node --check scripts/admin-editor.mjs
          node --check scripts/admin-local.mjs
      - name: Compilar e verificar ficheiros publicos
        run: npm run build
